name: Atualizar Boletim Legislativo

on:
  schedule:
    # Roda todo domingo à meia-noite (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permite rodar manualmente também

jobs:
  atualizar:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4 python-docx
      
      - name: Gerar boletim
        run: |
          python scripts/gerar_boletim.py
      
      - name: Commit e Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Boletim Bot"
          git add index.html
          git commit -m "Boletim atualizado - $(date '+%Y-%m-%d')" || echo "Sem mudanças"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
